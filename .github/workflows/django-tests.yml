name: Django tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Generate local-only test secret
        run: |
          python - <<'PYCODE'
          import json
          import secrets
          from pathlib import Path
          Path('.medidesk_local.json').write_text(json.dumps({
              'SECRET_KEY': secrets.token_urlsafe(56), 'DEBUG': True
          }), encoding='utf-8')
          PYCODE
      - name: Validate Django configuration and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python -m pip check
      - name: Run Django test suite
        run: python manage.py test --noinput --verbosity 1
      - name: GitHub safety scan
        run: python check_medidesk_github_safety.py
